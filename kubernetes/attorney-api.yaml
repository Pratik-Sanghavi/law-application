apiVersion: apps/v1
kind: Deployment
metadata:
  name: attorney-api
  namespace: law-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attorney-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attorney-api
    spec:
      containers:
        - name: api
          image: localhost:5000/law/attorney-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: attorney-api-db-credentials
            - configMapRef:
                name: lead-runtime-config
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: attorney-api
  namespace: law-application
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: attorney-api
  ports:
    - name: http
      port: 8001
      targetPort: http